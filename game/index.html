<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideglass Observatory — Spot the Difference</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header id="topbar">
  <div id="brand">TIDEGLASS OBSERVATORY</div>
  <div id="hud-scene" class="hud-item">District Map</div>
  <div id="hud-timer" class="hud-item">--:--</div>
  <div id="hud-lives" class="hud-item" aria-label="lives"></div>
  <div id="hud-score" class="hud-item">Score 0</div>
  <div id="hud-streak" class="hud-item"></div>
  <div id="hud-found" class="hud-item">0 / 7 found — 7 remain</div>
</header>
<main id="stage">
  <canvas id="game" width="1224" height="520" aria-label="Tideglass Observatory: two near-identical pictures side by side; click the differences"></canvas>
</main>
<footer id="controls">
  <button id="btn-hint" type="button">Hint (3)</button>
  <button id="btn-pause" type="button">Pause</button>
  <button id="btn-zoomin" type="button">Zoom +</button>
  <button id="btn-zoomout" type="button">Zoom −</button>
  <button id="btn-map" type="button">District Map</button>
  <button id="btn-restart" type="button">Restart Scene</button>
  <button id="btn-mute" type="button">Mute</button>
  <span id="keys-help">Keys: H hint · P pause · M mute · R restart · +/− zoom · arrows pan · wheel zoom · drag to pan</span>
</footer>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
